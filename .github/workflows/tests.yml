name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7.44", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: kjaiu_test
          MYSQL_USER: kjaiu
          MYSQL_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=tcp --host=127.0.0.1 --user=kjaiu --password=root --database=kjaiu_test --execute='SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:dGVzdC1hcHAtS2V5LXRlc3QtYXBwLUtleS0xMjM0NTY=
      KJAIU_JWT_SECRET: test-jwt-secret-test-jwt-secret-1234
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kjaiu_test
      DB_USERNAME: kjaiu
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        if: matrix.mysql == '8.4'
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        if: matrix.mysql == '8.4'
        run: npm ci

      - name: Static and frontend checks
        if: matrix.mysql == '8.4'
        run: |
          npm run lint:php
          npm run format:check
          npm run build

      - name: Validate Laravel boot and schema
        run: |
          php artisan route:list
          php artisan view:cache
          find storage/framework/views -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan migrate:fresh --seed --force

      - name: Run SQLite tests
        if: matrix.mysql == '8.4'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_URL: ""
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Run MySQL tests
        run: vendor/bin/phpunit --configuration phpunit.mysql.xml
