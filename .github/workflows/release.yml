name: Release

# Builds the deployable archives and attaches them to a GitHub release.
#
# Tags without a suffix (v0.x) are published as pre-releases, matching how the
# 0.x line has been released so far; `-rc1` / `-beta1` style tags are too.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_DATABASE: kjaiu_ci
          MYSQL_USER: kjaiu
          MYSQL_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=tcp --host=127.0.0.1 --user=kjaiu --password=root --database=kjaiu_ci --execute='SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      # Placeholder key: the suite never encrypts anything that outlives the run.
      APP_KEY: base64:X9U8yU6tMe9HthtUoJ8/eG3t6if1uTBGR0m1n7pzLIY=
      KJAIU_JWT_SECRET: ci-placeholder-jwt-secret-0123456789
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kjaiu_ci
      DB_USERNAME: kjaiu
      DB_PASSWORD: root
      DB_PREFIX: shd_
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, tokenizer, xml, zip
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      # The assets must exist before the suite runs: the storefront layouts use
      # `@vite`, which needs `public/build/manifest.json`, and the panel route
      # answers 503 while `public/admin-assets/index.html` is missing. Both are
      # ignored by git, so they are never present in a fresh checkout.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build storefront assets
        run: npm run build

      - name: Build administrator panel
        working-directory: admin-spa
        run: |
          npm ci
          npm run build

      - name: Assert the build produced both asset sets
        run: |
          test -f public/build/manifest.json
          test -f public/admin-assets/index.html

      # The mirrored schema is imported rather than migrated: `database/schema`
      # already contains every table the platform uses, including the framework
      # ones, so running migrations on top of it would collide.
      - name: Import schema and seed
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --user=kjaiu --password=root kjaiu_ci < database/schema/kjaiu.sql
          php artisan db:seed --force --no-interaction

      - name: Run the suite
        run: vendor/bin/phpunit --configuration phpunit.xml

  build:
    name: Build deployment archives
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, tokenizer, xml, zip
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install production PHP dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader
          composer audit --no-dev --no-interaction
          composer check-platform-reqs --no-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets
        run: |
          npm run build
          cd admin-spa && npm ci && npm run build

      - name: Create deployment archives
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          package="kjaiu-${version}"
          stage="release/${package}"
          mkdir -p "${stage}" dist

          cp -a \
            .env.example \
            LICENSE \
            README.md \
            app \
            artisan \
            bootstrap \
            composer.json \
            composer.lock \
            config \
            database \
            docs \
            public \
            resources \
            routes \
            storage \
            vendor \
            "${stage}/"

          printf '%s\n' "${version}" > "${stage}/VERSION"
          printf '%s\n' "${GITHUB_SHA}" > "${stage}/REVISION"

          # Reproducible timestamps so the same commit yields the same archive.
          epoch="$(git log -1 --format=%ct)"
          find "${stage}" -exec touch -h -d "@${epoch}" {} +
          tar \
            --sort=name \
            --mtime="@${epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "dist/${package}.tar.gz" \
            -C release "${package}"
          (cd release && zip -X -q -r "../dist/${package}.zip" "${package}")
          (cd dist && sha256sum "${package}.tar.gz" "${package}.zip" > SHA256SUMS)

          echo "package=${package}" >> "${GITHUB_OUTPUT}"

      - name: Verify the archives
        shell: bash
        run: |
          package="${{ steps.package.outputs.package }}"
          verify="$(mktemp -d)"

          (cd dist && sha256sum --check SHA256SUMS)
          unzip -tq "dist/${package}.zip"
          tar -xzf "dist/${package}.tar.gz" -C "${verify}"

          # Everything an installation needs is present...
          test -f "${verify}/${package}/vendor/autoload.php"
          test -f "${verify}/${package}/public/build/manifest.json"
          test -f "${verify}/${package}/public/admin-assets/index.html"
          test -f "${verify}/${package}/resources/views/web/home.blade.php"
          test -f "${verify}/${package}/database/schema/kjaiu.sql"
          test -f "${verify}/${package}/composer.lock"
          # ...and nothing that belongs to the machine it was built on.
          test ! -e "${verify}/${package}/.env"
          test ! -e "${verify}/${package}/node_modules"
          test ! -e "${verify}/${package}/tests"
          test ! -e "${verify}/${package}/admin-spa"

          (
            cd "${verify}/${package}"
            APP_KEY=base64:X9U8yU6tMe9HthtUoJ8/eG3t6if1uTBGR0m1n7pzLIY= php artisan route:list
            APP_KEY=base64:X9U8yU6tMe9HthtUoJ8/eG3t6if1uTBGR0m1n7pzLIY= php artisan view:cache
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            dist/${{ steps.package.outputs.package }}.tar.gz
            dist/${{ steps.package.outputs.package }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.package }}
          path: dist

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          package="${{ needs.build.outputs.package }}"

          if ! gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_flags=()
            # The whole 0.x line is a pre-release, with or without a suffix.
            if [[ "${version}" == *-* || "${version}" =~ ^v0\. ]]; then
              release_flags+=(--prerelease)
            fi

            gh release create "${version}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Kjaiu ${version}" \
              --generate-notes \
              "dist/${package}.tar.gz" \
              "dist/${package}.zip" \
              "dist/SHA256SUMS" \
              "${release_flags[@]}"
            exit 0
          fi

          gh release upload "${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            "dist/${package}.tar.gz" \
            "dist/${package}.zip" \
            "dist/SHA256SUMS" \
            --clobber
